    <!-- Font Resizer Logic -->
    <script>
        jQuery(document).ready(function ($) {
            var currentZoom = 100;

            $('#btn-font-increase').on('click', function (e) {
                e.preventDefault();
                e.stopPropagation();
                if (currentZoom < 140) {
                    currentZoom += 10;
                    $('body').css('zoom', currentZoom + '%');
                }
            });

            $('#btn-font-decrease').on('click', function (e) {
                e.preventDefault();
                e.stopPropagation();
                if (currentZoom > 80) {
                    currentZoom -= 10;
                    $('body').css('zoom', currentZoom + '%');
                }
            });

            $('#btn-font-reset').on('click', function (e) {
                e.preventDefault();
                e.stopPropagation();
                currentZoom = 100;
                $('body').css('zoom', '100%');
            });
        });
    </script>
